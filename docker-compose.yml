# Environnement de développement de Factura.
#
#   docker compose up -d          démarre PostgreSQL et PHP
#   docker compose run --rm php composer install
#   docker compose run --rm php php artisan migrate
#
# Le front (Vite) tourne sur le poste, pas ici : Node est installé nativement
# et signé, donc Smart App Control le laisse passer. Un conteneur de plus pour
# lui coûterait de la mémoire sans rien apporter.

name: factura

services:
  postgres:
    image: postgres:17-alpine
    container_name: factura-postgres
    environment:
      POSTGRES_USER: factura
      POSTGRES_PASSWORD: factura
      POSTGRES_DB: factura
    ports:
      # 5433 et non 5432 : le PostgreSQL d'un autre projet peut déjà occuper
      # le port standard. Deux bases de développement doivent pouvoir vivre
      # ensemble sans qu'on ait à en arrêter une.
      - "5433:5432"
    volumes:
      - factura-donnees:/var/lib/postgresql/data
    mem_limit: 320m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U factura"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  php:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: factura-php
    ports:
      - "8000:8000"
    volumes:
      # Le code vit sur le poste et n'est que monté : on édite dans son éditeur
      # habituel, le conteneur voit la modification aussitôt.
      - .:/app

      # MAIS PAS `vendor/`, qui reste dans un volume Docker.
      #
      # Chaque requête Laravel ouvre plus de mille fichiers de `vendor/`. À
      # travers le pont de fichiers de Docker Desktop, chacun coûte quelques
      # millisecondes : l'amorçage seul mettait 4 secondes, mesuré, avant même
      # qu'une route soit résolue. Dans un volume, ces fichiers sont sur le
      # système du conteneur et l'amorçage retombe à quelques dizaines de
      # millisecondes.
      #
      # Contrepartie assumée : `vendor/` n'existe plus sur le poste, donc
      # l'éditeur n'y trouve plus les sources de Laravel pour l'autocomplétion.
      # `composer install` doit tourner DANS le conteneur — ce qui était déjà
      # le cas, puisque PHP n'y est pas installé.
      - factura-vendor:/app/vendor
    environment:
      # Le serveur intégré de PHP traite UNE requête à la fois. Une page qui
      # demande son CSS, son JS et son icône fait attendre chacun derrière le
      # précédent, et la lenteur ressemble à celle de l'application alors
      # qu'elle est dans la file d'attente. Quatre ouvriers suffisent ici.
      PHP_CLI_SERVER_WORKERS: "4"

    # Aucune variable DB_* ici, volontairement. Une variable d'environnement
    # du conteneur écrase tout : le `.env`, le `.env.testing`, et jusqu'aux
    # valeurs déclarées dans `phpunit.xml`. La suite de tests a tourné une fois
    # sur la base de DÉVELOPPEMENT à cause de cela — et `RefreshDatabase` l'a
    # vidée. Le `.env` est la seule source de configuration, et `.env.testing`
    # peut alors faire son travail.
    mem_limit: 512m
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  factura-donnees:
  factura-vendor:
