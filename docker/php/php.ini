; Réglages de PHP pour le développement de Factura.
;
; L'essentiel de ce fichier existe pour UNE raison : le code est monté depuis
; Windows dans le conteneur, et chaque lecture de fichier traverse le pont de
; fichiers de Docker Desktop. Une requête Laravel ouvre plusieurs centaines de
; fichiers ; sans les caches ci-dessous, elle met plusieurs secondes à
; répondre, et l'application paraît cassée alors qu'elle ne fait qu'attendre le
; disque.

[opcache]
opcache.enable = 1

; INDISPENSABLE ici, et facile à manquer : `php artisan serve` n'est pas un
; serveur web classique, c'est le serveur intégré de PHP lancé par le SAPI
; **CLI**. Or opcache est désactivé par défaut en CLI. Sans cette ligne, tout
; le reste du fichier est chargé et sans aucun effet — les réglages se lisent
; bien dans `phpinfo()`, et le cache ne fonctionne pas.
opcache.enable_cli = 1

; Le code compilé reste en mémoire : les fichiers ne sont plus ni relus ni
; réanalysés à chaque requête.
opcache.memory_consumption = 192
opcache.interned_strings_buffer = 16

; Laravel et ses dépendances dépassent largement les 10 000 fichiers par
; défaut. Au-delà du plafond, opcache cesse simplement de mettre en cache —
; sans prévenir, et c'est précisément le symptôme qu'on cherche à éviter.
opcache.max_accelerated_files = 20000

; En développement, on VEUT que les modifications soient prises en compte —
; mais pas au prix d'un appel système par fichier et par requête. Deux
; secondes de latence sur un fichier modifié sont imperceptibles à l'usage.
; En production, ce réglage passe à 0 et le cache n'est vidé qu'au déploiement.
opcache.validate_timestamps = 1
opcache.revalidate_freq = 2

; Le cache des chemins résolus. Sur un montage lent, c'est lui qui évite le
; plus d'allers-retours : chaque `require` d'un chemin relatif provoque sinon
; une résolution complète à travers le pont.
realpath_cache_size = 8M
realpath_cache_ttl = 600

[PHP]
; La démonstration charge des jeux de données modestes ; 256 Mo suffisent
; largement et bornent une éventuelle boucle emballée.
memory_limit = 256M

; Le fuseau du projet. Sans lui, PHP retombe sur UTC et les dates d'échéance
; calculées en fin de journée basculent d'un jour.
date.timezone = Africa/Casablanca
