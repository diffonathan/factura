; Réglages de PHP en production.
;
; La différence avec le développement tient en une ligne : opcache ne
; revalide plus les horodatages. En production le code ne change pas entre
; deux démarrages du conteneur, et vérifier la date de chaque fichier à chaque
; requête coûte un appel système pour rien. Un déploiement crée un conteneur
; neuf, donc un cache neuf.

[opcache]
opcache.enable = 1

; INDISPENSABLE : `php artisan serve` est le serveur intégré de PHP, lancé par
; le SAPI CLI, où opcache est désactivé par défaut. Sans cette ligne, tout ce
; fichier se lit correctement dans phpinfo() et n'a aucun effet.
opcache.enable_cli = 1

opcache.memory_consumption = 128
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 0

realpath_cache_size = 4M
realpath_cache_ttl = 600

[PHP]
memory_limit = 256M
date.timezone = Africa/Casablanca

; Les erreurs partent dans la sortie d'erreur, que l'hébergeur collecte.
; Jamais dans la page : un message d'erreur PHP affiché à un visiteur révèle
; des chemins, des versions, parfois des requêtes.
display_errors = Off
log_errors = On
error_log = /dev/stderr
