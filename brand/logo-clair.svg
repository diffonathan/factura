<?xml version="1.0" encoding="UTF-8"?>
<!--
    Factura — logo pour FOND CLAIR (documents imprimés, courriels).

    La police est déclarée par une pile système et non par une fonte
    téléchargée. Un SVG affiché sur un dépôt, dans un lecteur de courriel ou
    dans une vignette de partage ne charge pas les fontes du site : un
    `font-family: 'DM Sans'` y retomberait sur du Times, et le logo aurait
    l'air cassé là précisément où il doit inspirer confiance.

    « Fact » est dans l'encre, « ura » dans l'or : la coupure met en valeur la
    fin du mot, et rappelle la construction du wordmark Hope Traders, où la
    seconde moitié porte la couleur de marque.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 64" width="260" height="64" role="img" aria-label="Factura">
  <defs>
    <linearGradient id="or" x1="0" y1="0" x2="1" y2="1" gradientTransform="rotate(-15 0.5 0.5)">
      <stop offset="0" stop-color="#e4bd5c"/>
      <stop offset="1" stop-color="#a67e12"/>
    </linearGradient>
  </defs>

  <rect width="64" height="64" rx="15" fill="url(#or)"/>

  <path fill="#14100a" d="
    M18 12 H46 Q49 12 49 15 V43
    L44.75 47 L40.5 43 L36.25 47 L32 43 L27.75 47 L23.5 43 L19.25 47 L15 43
    V15 Q15 12 18 12 Z"/>

  <rect x="20" y="19.5" width="24" height="3.4" rx="1.7" fill="#e4bd5c"/>
  <rect x="20" y="27"   width="24" height="3.4" rx="1.7" fill="#e4bd5c"/>
  <rect x="20" y="34.5" width="13" height="3.4" rx="1.7" fill="#e4bd5c"/>

  <text x="80" y="42"
        font-family="'Segoe UI', 'DM Sans', Arial, sans-serif"
        font-size="31" font-weight="700" letter-spacing="-1.2">
    <tspan fill="#14100a">Fact</tspan><tspan fill="#d4a017">ura</tspan>
  </text>
</svg>
